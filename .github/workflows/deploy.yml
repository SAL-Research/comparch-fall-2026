name: Build and deploy course website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: npm ci
      - run: npm run build
      - name: Deploy dist to gh-pages branch
        run: |
          SITE_ARCHIVE="$RUNNER_TEMP/site.tar"
          tar -C dist -cf "$SITE_ARCHIVE" .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:refs/remotes/origin/gh-pages
            git checkout -B gh-pages refs/remotes/origin/gh-pages
          else
            git checkout --orphan gh-pages
          fi

          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +

          tar -xf "$SITE_ARCHIVE" -C .
          touch .nojekyll

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "Deploy site from ${GITHUB_SHA}"
          git push origin HEAD:gh-pages
