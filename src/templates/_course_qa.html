<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Q&amp;A — {{#if code}}{{ code }} {{/if}}{{ title }}, {{ term }}</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        .section-title { border-bottom: 3px solid {{ accent }}; padding-bottom: .2rem; margin-top: 1.25rem; margin-bottom: .5rem; }
    </style>
</head>
<body>
    {{> navbar }}

    <main class="container pb-5">
        <div class="row g-4">
        <div class="col-12 col-lg-8 col-xl-9 order-2 order-lg-1">
            <h2 class="section-title">Q&amp;A</h2>
            {{#if qa.intro}}<p class="mt-3">{{{ qa.intro }}}</p>{{/if}}
            {{#if (eq qa.giscus.repo_id "TBA")}}
            <p><em>The discussion board is being set up and will appear here shortly.</em></p>
            {{else}}
            <script src="https://giscus.app/client.js"
                    data-repo="{{ qa.giscus.repo }}"
                    data-repo-id="{{ qa.giscus.repo_id }}"
                    data-category="{{ qa.giscus.category }}"
                    data-category-id="{{ qa.giscus.category_id }}"
                    data-mapping="specific"
                    data-term="{{ qa.giscus.term }}"
                    data-strict="0"
                    data-reactions-enabled="1"
                    data-emit-metadata="0"
                    data-input-position="top"
                    data-theme="light"
                    data-lang="en"
                    crossorigin="anonymous"
                    async>
            </script>
            {{/if}}
        </div>

        <div class="col-12 col-lg-4 col-xl-3 order-1 order-lg-2">
            {{> sidebar }}
        </div>
        </div>
    </main>

    {{> footer }}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
